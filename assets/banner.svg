<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="30%" style="stop-color:#00f7ff"/>
      <stop offset="70%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#bg)" rx="10"/>

  <!-- Animated shimmer dots -->
  <circle cx="60" cy="30" r="2" fill="#00f7ff" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="30" r="2" fill="#7c3aed" opacity="0.4">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="90" r="1.5" fill="#7c3aed" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="90" r="1.5" fill="#00f7ff" opacity="0.3">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Main title -->
  <text x="400" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff" opacity="0">
    👋 Hey, I'm Anto
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Subtitle with typewriter feel -->
  <text x="400" y="88" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b949e" opacity="0">
    Student Developer · Cybersecurity Enthusiast · React &amp; Node.js
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" fill="freeze"/>
  </text>

  <!-- Bottom accent line -->
  <rect x="0" y="112" width="800" height="3" fill="url(#line)" rx="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/>
  </rect>
</svg>
